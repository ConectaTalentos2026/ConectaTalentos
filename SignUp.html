<!doctype html>
<html lang="pt-br">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="keywords" content="ConectaTalentos, Vagas de Emprego, Capacitação, Acessibilidade, Oportunidades" />
  <meta name="description"
    content="Site da empresa, ConectaTalentos. Oferecemos oportunidades para jovens do Brasil a crescem profissionalmente." />
  <meta name="author" content="Time ConectaTalentos" />
  <meta name="robots" content="index, follow" />

  <meta property="og:type" content="website" />
  <meta property="og:title" content=" ConectaTalentos " />
  <meta property="og:description" content="Pagina de Login da ConectaTalentos." />

  <link rel="icon" type="image/svg+xml" href="assets/Logo.png" />
  <link rel="stylesheet" href="assets/Css/variables.css" />
  <link rel="stylesheet" href="assets/Css/stylessignup.css" />

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
  <link
    href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Poppins:wght@400;500;600;700&display=swap"
    rel="stylesheet" />

  <script src="mostrarsenha.js"></script>

  <title>SignUp</title>
</head>

<body class="estrutura">
  <header class="cabecalio">
    <a class="logo" href="Index.html" aria-label="ConectaTalentos - Página Inicial">
      <img src="assets/Conecta.png" alt="ConectaTalentos" />
      <h1 class="sr-only">ConectaTalentos</h1>
    </a>
  </header>

  <main class="signup-container">
    <section class="signup">
      <div class="signup-header">
        <img src="assets/Conecta.png" alt="ConectaTalentos" />
        <h2>Crie sua Conta</h2>
        <h3>preencha seus dados</h3>
      </div>
      <form action="link-do-backend/api" class="signup-form">
        <div class="input-group">
          <label class="sr-only" for="nome">Nome Completo</label>
          <input type="text" id="nome" name="nome" required placeholder="Nome Completo:" />
        </div>

        <div class="input-group">
          <label class="sr-only" for="email">Email</label>
          <input id="email" type="email" name="email" required placeholder="Email:" />
        </div>

        <div class="input-group">
          <label class="sr-only" for="phone">Telefone</label>
          <input id="phone" name="phone" type="tel" required placeholder="Telefone:" />
        </div>

        <div class="input-group">
          <label class="sr-only" for="senha">Senha</label>
          <input id="senha" name="senha" type="password" required placeholder="Senha:" />
          <i class="bi bi-eye-fill" id="btn-senha" onclick="mostrarSenha()"></i>
        </div>

        <div class="input-group">
          <label class="sr-only" for="confirmarsenha">
            Confirmar senha
          </label>

          <input id="confirmarsenha" name="confirmarsenha" type="password" required placeholder="Senha novamente:" />
        </div>

        <div class="checkbox-group">
          <input type="checkbox" id="checkbox" name="checkbox" required />
          <label for="checkbox">
            Selecione para criar uma conta corporativa</label>
          <p>
            Ao clicar em “<strong>criar conta</strong>” declaro que aceito as
            Políticas<br />
            de privacidade e os Termos de Uso da
            <strong>ConectaTalentos</strong>
          </p>
        </div>

        <div>
          <button class="btn-primary" type="submit">Criar Conta</button>
        </div>

        <div>
          <p class="login-link">
            Já tenho conta. <a href="Login.html">Fazer Login</a>
          </p>
        </div>
      </form>
    </section>
    <div class="signup-image"></div>
  </main>
</body>

</html>
